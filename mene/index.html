<!DOCTYPE html>
<html lang="en" translate="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="google" content="notranslate">

    <title>Programmer Meme</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            width: 500px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.03);
        }

        .card img {
            width: 100%;
            height: 350px;
            object-fit: cover;
        }

        .content {
            padding: 20px;
            text-align: center;
        }

        .content h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 28px;
        }

        .content p {
            font-size: 20px;
            color: #555;
            line-height: 1.6;
        }

        strong {
            color: #111;
        }
    </style>

</head>

<body>

    <div class="card">

        <img src="https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=900" 
             alt="Programming">

        <div class="content">

            <h2>😂 Programmer's Reality</h2>

            <p>
                <strong>Friend:</strong> "Can you fix my laptop?"
                <br><br>

                <strong>Me:</strong> "I'm a software developer..." 💻
                <br><br>

                <strong>Friend:</strong> "Same thing!" 🤦‍♂️
            </p>

        </div>

    </div>

</body>

</html>
